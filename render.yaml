# Render Blueprint: New > Blueprint > select this repo. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: fhir-expert-panel
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NUGEN_API_KEY
        sync: false
      - key: EXPERT_FHIR_MODEL_ID
        value: model_fhir-healthcare-reasoning_alignment_01m1tybce6bsr93
      - key: EXPERT_CLINICAL_MODEL_ID
        sync: false
      - key: EXPERT_PRIOR_AUTH_MODEL_ID
        sync: false
      - key: ROUTER_MODEL_ID
        value: meta-llama/Llama-3.2-3B-Instruct
      - key: SYNTH_MODEL_ID
        value: meta-llama/Llama-3.2-3B-Instruct
      - key: ADMIN_TOKEN
        generateValue: true
